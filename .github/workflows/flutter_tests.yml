name: Keyboard compatibility

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        keyboard: ['^6.0.0', '^7.0.1']
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Resolve compatibility lane
        env:
          KEYBOARD_VERSION: ${{ matrix.keyboard }}
        run: |
          printf 'dependency_overrides:\n  flutter_keyboard_visibility: "%s"\n' "$KEYBOARD_VERSION" > pubspec_overrides.yaml
          flutter pub get
      - run: flutter test --no-pub
